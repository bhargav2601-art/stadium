name: CI & Production Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, and DB-free Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify production build without DATABASE_URL
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
        run: pnpm build

  migrate:
    name: Deploy Prisma Migrations
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Run prisma migrate deploy when DATABASE_URL secret is configured
        if: env.DATABASE_URL != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:migrate:deploy
